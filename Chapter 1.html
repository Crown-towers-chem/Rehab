<script>
// ===================== دالة تنظيف النص للصوت =====================
function cleanForSpeech(text) {
    let result = text;
    result = result.replace(/\([^)]*\)/g, ' '); 
    result = result.replace(/[.\/→]/g, ' ');      
    result = result.replace(/\s+/g, ' ').trim(); 
    return result;
}

// ===================== بيانات المحتوى =====================
const keyVocabL1 = [["aggressive (adj)", "عدواني"], ["appointment (n)", "موعد"], ["assignment (n)", "مهمة"], ["brave (adj)", "شجاع"], ["challenge (n)", "تحدٍّ"], ["claim (ed) (v), (n)", "يدّعي - ادعاء"], ["courage (n)", "شجاعة"], ["study (n)", "مكتب العمل أو الدراسة"], ["demand (ed) (v)", "يطلب بلهجة آمرة"], ["editor (n)", "محرر"], ["evidence (n)", "دليل / أدلة"], ["exact (adj)", "دقيق / محدد"], ["extraordinary (adj)", "غير عادي"], ["pretend (ed) (v)", "يتظاهر"], ["purpose (n)", "هدف"], ["reporter (n)", "صحفي"], ["reveal (ed) (v)", "يكشف"], ["sensible (adj)", "عاقل"], ["technical (adj)", "تقني / متخصص"], ["zoologist (n)", "عالم حيوان"]];
const partOneText = [{"en": "My name is Edward Malone, and at the time this story began I was a young reporter on the Daily Gazette in London. I was twenty-three, full of energy, and certain that a great life was waiting for me. The problem was that I had no idea how to begin it. There was also Gladys Hungerton. I admired her more than anyone I had ever met, and one evening I finally asked her to marry me. She did not laugh at me or become angry. Instead, she looked serious and told me that she valued our friendship but did not love me in the way I hoped."}, {"en": "Gladys said, \"I love a man who has done something brave [1].\""}, {"en": "Someone who has faced danger, traveled into the unknown, and proved that he can act when it matters.\" I tried to joke. \"So I must discover a new country before you will consider me?\""}, {"en": "Suggested Questions:\n1. What qualities did Gladys admire in the kind of man she could love?"}, {"en": "\"Not for me,\" she replied. \"If a man is truly brave, he does not act just to impress someone else. He acts because courage is part of his character.\" Her words stayed with me. I left her house feeling disappointed, but also strangely excited."}, {"en": "London suddenly seemed too safe. I wanted a challenge – something that would test me and give my life a clearer purpose [2]."}, {"en": "Suggested Questions:\n2. What kind of challenge did Malone want?"}, {"en": "The next evening I went straight to my editor, Mr McArdle. He was an experienced newspaper man [3] who had seen every kind of young reporter. When I asked him to send me on a dangerous assignment, he pushed his glasses up and stared at me."}, {"en": "Suggested Questions:\n3. Who was Mr McArdle?"}, {"en": "\"You want danger?\" he said. \"Most sensible people want to avoid it.\" \"I want a real story, sir. Something difficult.\""}, {"en": "He studied me for a moment, then smiled. \"Perhaps I do have a job for you. Have you heard of Professor George Edward Challenger?\""}, {"en": "Of course I had. Almost everyone in the newspaper world knew his name."}, {"en": "Challenger was a famous zoologist, brilliant but extremely difficult. He had recently returned from South America with an extraordinary story about unknown animals [4]."}, {"en": "Suggested Questions:\n4. What did Challenger bring back from South America?"}];
const partTwoText = [{"en": "When scientists questioned him, he refused to give clear details. When reporters tried to interview him, he often threw them out of his house – sometimes literally."}, {"en": "\"Do you want me to interview him?\" I asked."}, {"en": "\"If you can get through the front door,\" McArdle replied. \"Two years ago Challenger traveled alone through a little-known part of South America. He came back claiming that something remarkable had happened. He had damaged photographs, strange sketches, and a few pieces of evidence, but he would not reveal the exact place. Most people think he is either mistaken or lying. Find out which.\""}, {"en": "This was exactly the kind of chance I had been looking for. Yet there was one problem: Challenger hated journalists [5]. If I arrived honestly and said I worked for the Gazette, the interview would probably end before it began."}, {"en": "Suggested Questions:\n5. Why did Malone decide not to introduce himself as a journalist to Challenger?"}, {"en": "That night I went to the Savage Club, where many writers and scientists met. I found my friend Tarp Henry, who worked for a scientific journal, and asked what he knew about Challenger."}, {"en": "\"He is clever,\" Henry said, \"but impossible. He argues with everyone. At a scientific meeting in Vienna he almost started a battle over a theory of evolution. If you want to speak to him, do not mention newspapers.\""}, {"en": "That gave me an idea. I asked Henry to find Challenger's latest scientific paper. It was full of technical language I barely understood, but I copied one complicated sentence and used it in a letter. I pretended to be a young student who admired Challenger's work but had a question about one of his arguments."}, {"en": "Henry read the letter and laughed. \"You are taking a risk, Malone. He may realize at once that you know nothing about the subject.\""}, {"en": "\"I only need to get inside his study,\" I said. \"After that, I will take my chance.\" Two days later a reply arrived. The handwriting looked as aggressive as the man himself. Challenger wrote that my question showed poor understanding, but he was willing to explain the matter in person. He gave me an appointment for eleven o'clock on Wednesday morning."}, {"en": "I should have been nervous. Instead, I felt as if my real life had finally begun. On Wednesday I traveled to Professor Challenger's large house in Kensington [6]. A quiet servant named Austin opened the door. Before he could take me to the study, a small, lively woman stopped me in the hall."}, {"en": "Suggested Questions:\n6. Where was Professor Challenger's house?"}, {"en": "\"You have come to see my husband?\" she asked. \"Yes, Mrs Challenger.\" She lowered her voice. \"Then I should warn you. George is a perfectly impossible person. If he becomes angry, do not argue too long.\""}, {"en": "A deep voice suddenly roared from behind a closed door. Austin opened it, and I entered. Professor Challenger sat behind a wide desk covered with books, maps, fossils, and papers."}, {"en": "He was shorter than I expected, but enormously broad. His thick black beard spread across his chest, and his sharp grey-blue eyes seemed to measure every weakness in me."}, {"en": "\"Well?\" he demanded. \"You are the young man who has difficulty understanding plain science?\" I had entered looking for adventure. I had found it sooner than I expected."}];

// ===================== دوال HTML المساعدة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

// ===================== بناء الواجهة =====================
function buildAllSections() {
    const container = document.getElementById('sections-container');
    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            return `<div class="pill" id="${id}" data-speak="${cleanForSpeech(w[0])}" onclick="playOne('${id}')"><span class="en">${makeWordSpans(w[0])}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }
    function playBar(sectionId) {
        return `<div class="sec-play-bar"><button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button><button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button><button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button></div>`;
    }
    function makeStorySection(storyData) {
        return `<div class="story-card">${storyData.map((s,i) => {
            const id = `story_${i}_${Math.random().toString(36).slice(2,8)}`;
            const lines = String(s.en).split(/\n+/).map(x => x.trim()).filter(Boolean);
            const text = lines.join(' ');
            const isQuestion = /^Suggested Questions:/.test(text);
            return `<div class="sentence${isQuestion ? ' question-sentence' : ''}" id="${id}" data-speak="${text.replace(/"/g,'&quot;')}" onclick="playOne('${id}')">${makeWordSpans(text)}</div>`;
        }).join('')}</div>`;
    }
    const sections = [
        {id:'secVocab', title:'I VOCABULARY', content:`<div class="info-box"><div class="vocab">${makePills(keyVocabL1,'secVocab')}</div></div>`},
        {id:'secText', title:'III TEXT OF CHAPTER ONE', content:`<div style="font-weight:900;color:var(--A);font-size:1.15rem;margin:0 0 12px 2px;">A Dream of Adventure</div>${makeStorySection([...partOneText, ...partTwoText])}`}
    ];
    container.innerHTML = sections.map(sec => `<div class="section-block" id="${sec.id}"><div class="sec-title">${sec.title}</div><div class="sec-body">${playBar(sec.id)}${sec.content}</div></div>`).join('');
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
let voiceLoadAttempt = 0;
const MAX_VOICE_LOAD_ATTEMPTS = 6;
const VOICE_RETRY_DELAYS = [0, 150, 400, 800, 1500, 2500];

const normalizeVoiceLang = (lang) => String(lang || '').replace('_', '-');
const isVoiceLangMatch = (voiceLang, targetLang) => {
    const normalized = normalizeVoiceLang(voiceLang).toLowerCase();
    const target = targetLang.toLowerCase();
    return normalized === target || normalized.startsWith(target + '-');
};
const voiceQualityScore = (voice) => {
    const name = String(voice.name || '').toLowerCase();
    let score = 0;
    if (name.includes('google')) score += 30;
    if (name.includes('microsoft')) score += 25;
    if (name.includes('samantha')) score += 20;
    if (voice.localService) score += 2;
    return score;
};
const sortVoicesByQuality = (voiceList) => [...voiceList].sort((a, b) => {
    const scoreDifference = voiceQualityScore(b) - voiceQualityScore(a);
    return scoreDifference || String(a.name || '').localeCompare(String(b.name || ''));
});

function loadVoices() {
    const availableVoices = window.speechSynthesis.getVoices();
    if (availableVoices.length) {
        voices = availableVoices;
        voiceLoadAttempt = 0;
        populateVoiceSelect();
        return;
    }

    if (voiceLoadAttempt < MAX_VOICE_LOAD_ATTEMPTS) {
        const delay = VOICE_RETRY_DELAYS[voiceLoadAttempt] || VOICE_RETRY_DELAYS[VOICE_RETRY_DELAYS.length - 1];
        voiceLoadAttempt++;
        window.setTimeout(loadVoices, delay);
    }
}

function populateVoiceSelect() {
    const vs = document.getElementById('voiceSelect');
    const note = document.getElementById('voiceNote');
    if (!vs || !voices.length) return;

    const englishVoices = voices.filter(v =>
        isVoiceLangMatch(v.lang, 'en-US') || isVoiceLangMatch(v.lang, 'en-GB')
    );
    const displayedVoices = englishVoices.length ? sortVoicesByQuality(englishVoices) :
        sortVoicesByQuality(voices.filter(v => normalizeVoiceLang(v.lang).toLowerCase().startsWith('en')));

    if (!displayedVoices.length) {
        note.textContent = '⚠️ No English voice found.';
        return;
    }

    note.textContent = englishVoices.length ? '' : '⚠️ No US/UK voice found; showing English voices.';
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    vs.innerHTML = displayedVoices.map((voice) => {
        const lang = normalizeVoiceLang(voice.lang);
        const label = `${isVoiceLangMatch(lang, 'en-US') ? '🇺🇸 American' : isVoiceLangMatch(lang, 'en-GB') ? '🇬🇧 British' : 'English'} — ${voice.name} (${lang})`;
        const option = document.createElement('option');
        option.value = voice.voiceURI;
        option.textContent = label;
        option.dataset.lang = lang;
        return option.outerHTML;
    }).join('');

    const savedOption = [...vs.options].find(option => option.value === savedURI) ||
        [...vs.options].find(option => option.dataset.lang === savedLang);
    vs.value = savedOption ? savedOption.value : vs.options[0].value;
    const selected = voices.find(v => v.voiceURI === vs.value) || displayedVoices[0];
    localStorage.setItem('voiceURI', selected.voiceURI);
    localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
}

document.getElementById('voiceSelect').addEventListener('change', function() {
    const selected = voices.find(v => v.voiceURI === this.value);
    if (selected) {
        localStorage.setItem('voiceURI', selected.voiceURI);
        localStorage.setItem('voiceLang', normalizeVoiceLang(selected.lang));
    }
});

function getSelectedVoice() {
    const select = document.getElementById('voiceSelect');
    const savedURI = localStorage.getItem('voiceURI');
    const savedLang = localStorage.getItem('voiceLang');
    const selectedURI = savedURI || (select && select.value);
    return voices.find(v => v.voiceURI === selectedURI) ||
        voices.find(v => savedLang && normalizeVoiceLang(v.lang) === savedLang) ||
        voices.find(v => select && v.voiceURI === select.value) || null;
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}

function showFab(show) {
    if (show) fabPause.classList.add('show');
    else fabPause.classList.remove('show');
}

function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        fabPause.innerHTML = '⏸️';
    } else if (window.speechSynthesis.paused) {
        fabPause.innerHTML = '▶️';
    } else {
        fabPause.innerHTML = '⏯️';
    }
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights();
        showFab(false);
        return;
    }
    const item = window._q[window._qi];
    
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }

    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    const voice = getSelectedVoice();
    // Set the language explicitly; several browsers otherwise ignore the selected voice.
    u.lang = voice ? normalizeVoiceLang(voice.lang) : (localStorage.getItem('voiceLang') || 'en-US');
    if (voice) u.voice = voice;

    u.onstart = () => {
        showFab(true);
        updateFabIcon();
    };

    u.onend = function() {
        window._qi++;
        playQueue();
    };

    u.onerror = function(e) {
        console.warn('Speech error', e);
        window._qi++;
        playQueue();
    };

    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => {
        const trimmed = p.trim();
        if (trimmed) {
            window._q.push({id: id, text: trimmed});
        }
    });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause();
        updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume();
        updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() {
    pauseAll();
}

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
