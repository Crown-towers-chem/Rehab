        .vocab{display:flex;flex-wrap:wrap;gap:8px;}

        .sentence .speaker-label{display:inline-block;font-weight:900;color:var(--A2);margin-right:10px;background:var(--blue4);padding:2px 10px;border-radius:20px;font-size:0.9rem;}

        .story-title{font-family:'Cairo',sans-serif;font-weight:800;color:var(--A2);font-size:15px;text-align:right;direction:rtl;margin-bottom:10px;}
        .rules-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
        .rule-item{display:flex;align-items:flex-start;gap:12px;background:var(--blue5);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer;transition:all .2s;}
        .rule-item .rule-text{flex:1;}
        .rule-item .rule-text .en{font-size:15px;font-weight:700;color:var(--text);}
        .rule-item .rule-text .ar{font-family:'Cairo',sans-serif;font-size:13px;color:var(--text2);text-align:right;direction:rtl;font-weight:600;margin-top:4px;}
        .qbox{background:var(--blue5);border:1px dashed var(--border);border-radius:8px;padding:14px 16px;margin-top:6px;}
        .qbox .qitem{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;}
        .qbox .qitem:last-child{margin-bottom:0;}
        footer{text-align:center;margin-top:14px;padding:20px;color:var(--text2);font-size:12px;}
        footer strong{color:var(--A);}
        .voice-note{font-size:11px;color:#b45309;margin-top:4px;display:block;}
        .fab-pause{position:fixed;bottom:24px;right:24px;z-index:999;width:56px;height:56px;border-radius:50%;background:var(--fab-bg);color:var(--fab-text);border:none;box-shadow:0 4px 16px rgba(0,0,0,0.2);font-size:24px;display:none;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.2s,opacity 0.2s;}
        .fab-pause:active{transform:scale(.9);}
        .fab-pause.show{display:flex;}
    </style>
</head>

<script>
function cleanForSpeech(text) {
    let result = text;
    result = result.replace(/\([^)]*\)/g, ' ');
    result = result.replace(/[→]/g, ' ');
    result = result.replace(/'/g, '');
    result = result.replace(/"/g, '');
    result = result.replace(/\s+/g, ' ').trim();
    return result;
}

function escAttr(text) {
    return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

const readingTextL1 = [
    {en: "Lord John had hired a steam launch called the Esmeralda to carry us up the Amazon. The river was so wide that, even far inland, the opposite bank often looked like a distant shadow. Day after day we moved through heat, rain, brilliant sunlight, and walls of green forest.", ar: "استأجر اللورد جون قاربًا بخاريًا يُدعى إزميرالدا لينقلنا عبر نهر الأمازون. كان النهر واسعًا جدًا لدرجة أنه حتى في الداخل البعيد، بدا الضفة المقابلة غالبًا كظل بعيد. يومًا بعد يوم تحركنا عبر الحرارة والمطر وضوء الشمس الساطع وجدران الغابة الخضراء."},
    {en: "Challenger refused to reveal our exact route. He made all of us promise that, even if we returned safely, we would not publish enough information for strangers to locate the plateau. He said careless visitors could destroy a place that science had barely discovered.", ar: "رفض تشالنجر الكشف عن مسارنا الدقيق. جعلنا جميعًا نعد أنه حتى لو عدنا بأمان، لن ننشر معلومات كافية للغرباء لتحديد موقع الهضبة. قال إن الزوار المهملين يمكن أن يدروا مكانًا لم يكتشفه العلم إلا بالكاد."},
    {en: "After several days we left the main river and entered a large tributary. It gradually became narrower. At a small riverside village, Challenger ordered the Esmeralda back to Manaos.", ar: "بعد عدة أيام تركنا النهر الرئيسي ودخلنا رافدًا كبيرًا. أصبح أضيق تدريجيًا. في قرية صغيرة على ضفاف النهر، أمر تشالنجر إزميرالدا بالعودة إلى ماناوس."},
    {en: "\"From here we use canoes,\" he said. \"Soon there will be rapids. A steam launch cannot continue.\"", ar: "قال: \"من هنا نستخدم الزوارق. قريبًا ستكون هناك منحدرات سريعة. القارب البخاري لا يمكنه الاستمرار.\""},
    {en: "We hired two local guides who had accompanied Challenger during his earlier journey. They were clearly frightened by the idea of returning, but they knew the route.", ar: "استأجرنا دليلين محليين كانا قد رافقا تشالنجر خلال رحلته السابقة. كانا خائفين بوضوح من فكرة العودة، لكنهما كانا يعرفان الطريق."},
    {en: "For several days our canoes moved through a beautiful green waterway. Monkeys watched us from branches. Bright birds stood on fallen logs. Once we saw a puma disappear into the forest. The animals seemed less afraid of humans the farther we traveled.", ar: "لعدة أيام تحركت زوارقنا عبر ممر مائي أخضر جميل. كانت القرود تراقبنا من الأغصان. وقفت طيور زاهية على جذوع الأشجار الساقطة. ذات مرة رأينا نمرًا أمريكيًا يختفي في الغابة. بدت الحيوانات أقل خوفًا من البشر كلما توغلنا أكثر."},
    {en: "Then the water became too shallow. We hid the canoes and continued on foot, carrying food, rifles, blankets, instruments, and medical supplies.", ar: "ثم أصبح الماء ضحلًا جدًا. أخفينا الزوارق وواصلنا سيرًا على الأقدام، حاملين الطعام والبنادق والبطانيات والأدوات والإمدادات الطبية."},
    {en: "The land rose steadily. Thick tropical forest gave way to palms, rocky slopes, orchids, bamboo, and wide areas of tree-ferns. Progress was exhausting. Sometimes we spent an entire day cutting a path through bamboo so dense that we could see only a few meters ahead.", ar: "ارتفعت الأرض بثبات. أفسح الغابة الاستوائية الكثيفة المجال للنخيل والمنحدرات الصخرية والأوركيد والخيزران ومساحات واسعة من السراخس الشجرية. كان التقدم مرهقًا. أحيانًا كنا نقضي يومًا كاملاً في شق طريق عبر الخيزران الكثيف لدرجة أننا لا نرى سوى بضعة أمتار أمامنا."},
    {en: "Challenger and Summerlee argued constantly.", ar: "تشاجر تشالنجر وسمرلي باستمرار."},
    {en: "\"We should follow the compass,\" Challenger insisted one morning.", ar: "أصر تشالنجر في صباح أحد الأيام: \"يجب أن نتبع البوصلة.\""},

    {en: "Lord John usually prevented the arguments from becoming serious. \"Save your energy, gentlemen. You may need it for something with bigger teeth.\"", ar: "عادةً ما كان اللورد جون يمنع الجدال من أن يصبح خطيرًا. \"وفروا طاقتكم أيها السادة. قد تحتاجون إليه لشيء بأسنان أكبر.\""},
    {en: "On the ninth day after leaving the canoes, Challenger suddenly stopped and pointed. A huge grey shape rose from the plain ahead. It flapped slowly, flew low across the tree-ferns, and disappeared behind the forest.", ar: "في اليوم التاسع بعد مغادرة الزوارق، توقف تشالنجر فجأة وأشار. ارتفع شكل رمادي ضخم من السهل أمامنا. رفرف ببطء، وطار على ارتفاع منخفض عبر السراخس الشجرية، واختفى خلف الغابة."},
    {en: "\"A pterodactyl!\" Challenger cried.", ar: "صاح تشالنجر: \"بتيروداكتيل!\""},

    {en: "We spent several days searching for a way up. The main wall was almost vertical. At one point we found the entrance of an old cave, but the passage was blocked. We climbed surrounding hills and examined cracks and ledges. Nothing reached the plateau.", ar: "أمضينا عدة أيام في البحث عن طريق للصعود. كان الجدار الرئيسي عموديًا تقريبًا. في مرحلة ما وجدنا مدخل كهف قديم، لكن الممر كان مسدودًا. صعدنا التلال المحيطة وفحصنا الشقوق والحواف. لم يصل شيء إلى الهضبة."},
    {en: "Then Challenger noticed that the separate rock tower stood close to the main cliff. If we could climb the tower and somehow cross the gap, we might reach the top.", ar: "ثم لاحظ تشالنجر أن البرج الصخري المنفصل يقف بالقرب من الجرف الرئيسي. إذا تمكنا من تسلق البرج وعبور الفجوة بطريقة ما، فقد نصل إلى القمة."},
    {en: "The climb was difficult but possible. We carried a rope up and reached the tree that grew on the tower. From there we could see the green edge of the plateau only a short distance away—but between us and it was a deep chasm.", ar: "كان التسلق صعبًا لكنه ممكن. حملنا حبلًا لأعلى ووصلنا إلى الشجرة التي نمت على البرج. من هناك رأينا الحافة الخضراء للهضبة على مسافة قصيرة فقط - لكن بيننا وبينها كانت هناك هاوية عميقة."},
    {en: "Lord John looked at the tree. \"If we cut it down in the right direction, it could fall across the gap.\"", ar: "نظر اللورد جون إلى الشجرة. \"إذا قطعناها في الاتجاه الصحيح، فقد تسقط عبر الفجوة.\""},
    {en: "For hours we worked with axes. At last the tree began to move. It fell slowly, then crashed across the chasm with its upper branches landing on the plateau.", ar: "لساعات عملنا بالفؤوس. أخيرًا بدأت الشجرة تتحرك. سقطت ببطء، ثم تحطمت عبر الهاوية وهبطت أغصانها العلوية على الهضبة."},
    {en: "We had a bridge.", ar: "كان لدينا جسر."},
    {en: "Challenger insisted on going first. He sat astride the trunk and moved carefully across.", ar: "أصر تشالنجر على الذهاب أولاً. جلس فوق الجذع وتحرك بحذر عبره."},
    {en: "When he reached the far side, he climbed onto the plateau and raised both arms. \"At last!\" he shouted.", ar: "عندما وصل إلى الجانب الآخر، صعد إلى الهضبة ورفع ذراعيه. صاح: \"أخيرًا!\""},
    {en: "Summerlee crossed next, carrying two rifles. I followed. I tried not to look down at the enormous drop beneath the tree. Lord John came last, walking with a balance and calm that I could hardly believe.", ar: "عبر سمرلي بعد ذلك حاملاً بندقيتين. تبعته. حاولت ألا أنظر إلى الأسفل نحو السقوط الهائل تحت الشجرة. جاء اللورد جون أخيرًا، وهو يمشي بتوازن وهدوء بالكاد أصدقه."},
    {en: "For the first time, all four of us stood inside Maple White Land.", ar: "للمرة الأولى، وقفنا جميعًا الأربعة داخل أرض مابل وايت."},
    {en: "The air was warm and still. Thick bushes grew near the cliff, while taller trees formed a dark forest beyond. Strange calls came from somewhere in the distance.", ar: "كان الهواء دافئًا وساكنًا. نمت شجيرات كثيفة بالقرب من الجرف، بينما شكلت الأشجار الأطول غابة مظلمة خلفها. جاءت نداءات غريبة من مكان ما في المسافة."},
    {en: "Challenger's face shone with triumph.", ar: "أشرق وجه تشالنجر بالانتصار."},
    {en: "\"Professor Summerlee,\" he said, \"we can now begin the investigation you demanded.\" Summerlee adjusted his glasses. \"We can begin it. I have not yet said how it will end.\"", ar: "قال: \"بروفيسور سمرلي، يمكننا الآن بدء التحقيق الذي طلبته.\" عدل سمرلي نظارته. \"يمكننا البدء فيه. لم أقل بعد كيف سينتهي.\""},
    {en: "We moved about fifty meters into the bushes.", ar: "تحركنا حوالي خمسين مترًا داخل الشجيرات."},
    {en: "Then we heard a terrible cracking sound behind us. We ran back. The tree bridge was gone. Far below, its broken trunk lay at the foot of the cliff.", ar: "ثم سمعنا صوت تكسير فظيع خلفنا. ركضنا عائدين. كان جسر الشجرة قد اختفى. في الأسفل البعيد، كان جذعها المكسور مستلقيًا عند سفح الجرف."},
    {en: "At first we thought it had slipped. Then a face appeared on the opposite rock tower. It was Gomez.", ar: "في البداية ظننا أنها انزلقت. ثم ظهر وجه على البرج الصخري المقابل. كان جوميز."},
    {en: "His calm expression had disappeared. He looked across the gap at Lord John with open hatred.", ar: "اختفى تعبيره الهادئ. نظر عبر الفجوة إلى اللورد جون بكراهية مكشوفة."},
    {en: "\"You are trapped now!\" he shouted. Lord John stepped forward. \"Why?\"", ar: "صاح: \"أنتم محاصرون الآن!\" تقدم اللورد جون. \"لماذا؟\""},
    {en: "Gomez laughed. \"Think of Pedro Lopez. He was my brother. You killed him. I have waited years for this.\"", ar: "ضحك جوميز. \"فكر في بيدرو لوبيز. كان أخي. أنت قتلته. انتظرت سنوات لهذا.\""},
    {en: "So the past had followed us into the unknown.", ar: "لذلك تبعنا الماضي إلى المجهول."},
    {en: "Gomez had pushed the tree from the tower after we crossed. The four of us were now on a plateau surrounded by cliffs, with no known road down.", ar: "دفع جوميز الشجرة من البرج بعد أن عبرنا. كنا الآن الأربعة على هضبة محاطة بالمنحدرات، مع عدم وجود طريق معروف للأسفل."},
    {en: "\"Your bones will stay up there,\" Gomez called.", ar: "نادى جوميز: \"ستبقى عظامكم هناك.\""},
    {en: "A moment later Lord John raised his rifle. Gomez disappeared behind the rock. We heard shouting and then silence.", ar: "بعد لحظة رفع اللورد جون بندقيته. اختفى جوميز خلف الصخرة. سمعنا صراخًا ثم صمتًا."},
    {en: "Below us, however, Zambo had remained loyal. He climbed the opposite tower as soon as Gomez and the others were gone.", ar: "ومع ذلك، ظل زامبو مخلصًا تحتنا. صعد البرج المقابل بمجرد أن رحل جوميز والآخرون."},
    {en: "\"Tell me what to do!\" he shouted.", ar: "صاح: \"أخبرني ماذا أفعل!\""},
    {en: "We used a thin rope to pull food and ammunition across the gap. Zambo promised to stay below and help us in any way he could.", ar: "استخدمنا حبلًا رفيعًا لسحب الطعام والذخيرة عبر الفجوة. وعد زامبو بالبقاء في الأسفل ومساعدتنا بأي طريقة ممكنة."},
    {en: "As night came, we camped near the cliff with only a small lantern. Behind us stretched the unexplored forest of the plateau.", ar: "مع حلول الليل، خيمنا بالقرب من الجرف بمصباح صغير فقط. خلفنا امتدت غابة الهضبة غير المستكشفة."},
    {en: "We had reached the lost world. And now we could not leave it.", ar: "لقد وصلنا إلى العالم المفقود. والآن لم نعد نستطيع مغادرته."}
];

const readingQuestions = [];

// ===================== بناء الواجهة =====================
function makeWordSpans(text) {
    const words = text.trim().split(/\s+/);
    return words.map((w, idx) => `<span class="word" data-word-index="${idx}">${w}</span>`).join(' ');
}

function buildAllSections() {
    const container = document.getElementById('sections-container');

    function makePills(wordsArray, sectionId) {
        return wordsArray.map((w, i) => {
            const id = `${sectionId}_p${i}`;
            const wordHtml = makeWordSpans(w[0]);
            const speakText = cleanForSpeech(w[0]);
            return `<div class="pill" id="${id}" data-speak="${escAttr(speakText)}" onclick="playOne('${id}')"><span class="en">${wordHtml}</span><span class="tr">${w[1]}</span></div>`;
        }).join('');
    }

    function makeRuleItem(icon, sectionId, index, speakText, arText, displayText) {
        const id = `${sectionId}_${index}`;
        const wordHtml = makeWordSpans(displayText || speakText);
        const finalSpeak = cleanForSpeech(speakText);
        return `<div class="rule-item" id="${id}" data-speak="${escAttr(finalSpeak)}" onclick="playOne('${id}')">
            <span class="rule-icon">${icon}</span>
            <div class="rule-text">
                <span class="en">${wordHtml}</span>
                <span class="ar">${arText || ''}</span>
            </div>
        </div>`;
    }

    function playBar(sectionId) {
        return `<div class="sec-play-bar">
            <button class="big-btn" style="background:linear-gradient(135deg,var(--A),var(--A2))" onclick="playSection('${sectionId}')">▶ Play</button>
            <button class="big-btn pause-btn" onclick="pauseAll()">⏸ Pause</button>
            <button class="big-btn stop-btn" onclick="stopAll()">⏹ Stop</button>
        </div>`;
    }

    function makeStorySection(title, titleAr, storyData, idPrefix) {
        const speakerEmojis = {"Malone":"🧑‍💼","Challenger":"🧔","Summerlee":"👨‍🔬","Lord John":"🤠","Gomez":"😠","Zambo":"💪","Gladys":"👩","Austin":"🕴️","Mrs. Challenger":"👩","Henry":"📝"};
        const knownSpeakers = new Set(Object.keys(speakerEmojis));

        return `<div class="story-card">
            <div style="font-weight:bold;color:var(--A);margin-bottom:6px;">${title}</div>
            ${titleAr ? `<div class="story-title">${titleAr}</div>` : ''}
            ${storyData.map((s,i) => {
                const id = `${idPrefix}_s${i}`;
                let enText = s.en;
                let speaker = '';
                let dialogueText = enText;
                const colonIndex = enText.indexOf(': ');
                if (colonIndex > 0) {
                    const candidate = enText.substring(0, colonIndex);
                    if (knownSpeakers.has(candidate)) {
                        speaker = candidate;
                        dialogueText = enText.substring(colonIndex + 2);
                    }
                }
                const emoji = speakerEmojis[speaker] || '📖';
                const wordHtml = makeWordSpans(dialogueText);
                let speakerHtml = '';
                if (speaker) {
                    speakerHtml = `<span class="speaker-label">${emoji} ${speaker}</span> `;
                }
                return `<div class="sentence" id="${id}" data-speak="${escAttr(s.en)}" onclick="playOne('${id}')">
                    ${speakerHtml} ${wordHtml}
                </div> `;
            }).join('')}
            <div class="story-ar">${storyData.map(s => s.ar).join(' ')}</div>
        </div>`;
    }

    const sections = [];

    // 1. Key Vocabulary
    if (keyVocab && keyVocab.length > 0) {
        sections.push({ title:"💊 Key Vocabulary", id:"secKeyVocab", content: `<div class="info-box"><div class="info-title">Key Vocabulary (4.1)</div><div class="vocab">${makePills(keyVocab, "secKeyVocab")}</div></div>` });
    }

    // 2. Main Vocabulary
    if (mainVocab && mainVocab.length > 0) {
        sections.push({ title:"📚 Vocabulary", id:"secMainVocab", content: `<div class="info-box"><div class="info-title">Vocabulary (Chapter 4)</div><div class="vocab">${makePills(mainVocab, "secMainVocab")}</div></div>` });
    }

    // 3. Phrases, Expressions & Idioms
    if (idiomsData && idiomsData.length > 0) {
        sections.push({ title:"💡 Expressions, Phrases & Prepositions", id:"secIdioms", content: `<div class="rules-grid">${idiomsData.map((e,i) => makeRuleItem('✨', 'secIdioms', i, e[0], e[1], e[0])).join('')}</div>` });
    }

    // 4. Prepositions
    if (prepositionsData && prepositionsData.length > 0) {
        sections.push({ title:"🔗 Prepositions", id:"secPrepositions", content: `<div class="rules-grid">${prepositionsData.map((p,i) => makeRuleItem('🔗', 'secPrepositions', i, p[0], p[1], p[0])).join('')}</div>` });
    }

    // 5. Definitions
    if (defsData && defsData.length > 0) {
        sections.push({ title:"📝 Definitions", id:"secDefs", content: `<div class="rules-grid">${defsData.map((d,i) => {
            const speakText = cleanForSpeech(d.word) + " | " + d.def;
            const displayText = `${d.word} → ${d.def}`;
            return makeRuleItem('📖', 'secDefs', i, speakText, d.ar, displayText);
        }).join('')}</div>` });
    }

    // 6. Synonyms & Antonyms
    if (synData && synData.length > 0) {
        sections.push({ title:"🔄 Synonyms", id:"secSyn", content: `<div class="rules-grid">${synData.map((s,i) => makeRuleItem('↔️', 'secSyn', i, s.word + " | " + s.syn, s.syn, s.word)).join('')}</div>` });
    }
    if (antData && antData.length > 0) {
        sections.push({ title:"🚫 Antonyms", id:"secAnt", content: `<div class="rules-grid">${antData.map((a,i) => makeRuleItem('🛑', 'secAnt', i, a.word + " | " + a.ant, a.ant, a.word)).join('')}</div>` });
    }

    // 7. Derivatives
    if (derivativesData && derivativesData.length > 0) {
        sections.push({ title:"🔨 Derivatives (Word Families)", id:"secDerivatives", content: `<div class="rules-grid">${derivativesData.map((d,i) => {
            const formsStr = d.forms.join(" | ");
            const speakText = `${d.word} | ${formsStr}`;
            const displayText = `${d.word} → ${formsStr}`;
            return makeRuleItem('🔨', 'secDerivatives', i, speakText, d.ar, displayText);
        }).join('')}</div>` });
    }

    // 8. Focus on Vocabulary (Clear the Confusion)
    if (confusionData && confusionData.length > 0) {
        sections.push({ title:"🧐 Focus on Vocabulary", id:"secConfusion", content: `<div class="rules-grid">${confusionData.map((c,i) => {
            const speakText = `${c.word} | ${c.ex}`;
            const displayText = `${c.word} → ${c.ex}`;
            return makeRuleItem('🧐', 'secConfusion', i, speakText, c.ar, displayText);
        }).join('')}</div>` });
    }

    // 9. Reading Text
    if (readingTextL1 && readingTextL1.length > 0) {
        let readingContent = makeStorySection(readingTitle.en, readingTitle.ar, readingTextL1, 'secReadL1');
        if (readingQuestions && readingQuestions.length > 0) {
            readingContent += `<div class="qbox"><div class="info-title">JRE (Justify – Reason – Evidence)</div>${readingQuestions.map(q => `<div class="qitem">${q}</div>`).join('')}</div>`;
        }
        sections.push({ title:"📖 Chapter Text", id:"secReadL1", content: readingContent });
    }

    // 10. Listening Text
    if (listeningTextL2 && listeningTextL2.length > 0) {
        let listeningContent = '';
        if (listeningVocab && listeningVocab.length > 0) {
            listeningContent += `<div class="info-box"><div class="info-title">Listening Glossary</div><div class="vocab">${makePills(listeningVocab, "secListenVocab")}</div></div>`;
        }
        listeningContent += makeStorySection(listeningTitle, '', listeningTextL2, 'secListenL2');
        sections.push({ title:"🎧 Listening Text", id:"secListenL2", content: listeningContent });
    }

    let html = '';
    sections.forEach(sec => {
        html += `<div class="section-block" id="${sec.id}">
            <div class="sec-title">${sec.title}</div>
            <div class="sec-body">
                ${playBar(sec.id)}
                ${sec.content}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

// ===================== نظام الصوت =====================
const rateRange = document.getElementById('rateRange');
const rateBadge = document.getElementById('rateBadge');
const fabPause = document.getElementById('fabPause');

const savedRate = localStorage.getItem('speechRate') || 1;
rateRange.value = savedRate;
rateBadge.textContent = parseFloat(savedRate).toFixed(1)+'x';
rateRange.addEventListener('input', () => {
    const val = parseFloat(rateRange.value).toFixed(1);
    rateBadge.textContent = val+'x';
    localStorage.setItem('speechRate', val);
});

let voices = [];
let voiceLoadAttempts = 0;
const voiceSelectEl = document.getElementById('voiceSelect');
const voiceNoteEl = document.getElementById('voiceNote');

function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    voiceLoadAttempts++;
    populateVoiceSelect();
}

function pickBestVoice(list, langPrefix) {
    if (!list.length) return null;
    const normalizeLang = (lang) => (lang || '').replace('_', '-');
    const isLangMatch = (voiceLang) => normalizeLang(voiceLang) === langPrefix || normalizeLang(voiceLang).startsWith(langPrefix + '-');
    const candidates = list.filter(v => isLangMatch(v.lang));
    if (!candidates.length) return null;
    const scored = candidates.map(v => {
        let score = 0;
        if (v.localService) score += 2;
        if (/Google|Natural|Neural|Online/i.test(v.name)) score += 3;
        if (v.default) score += 1;
        return { v, score };
    }).sort((a, b) => b.score - a.score);
    return scored[0].v;
}

const FORCED_ACCENTS = [
    { code: 'en-US', label: '🇺🇸 American' },
    { code: 'en-GB', label: '🇬🇧 British' }
];

function populateVoiceSelect() {
    const allVoices = voices;
    if (!allVoices.length) {
        voiceNoteEl.textContent = voiceLoadAttempts > 4 ? '⚠️ لم يتم العثور على أصوات. جرّب تحديث الصفحة.' : '⏳ جاري تحميل الأصوات...';
    }
    const savedCode = localStorage.getItem('ttsLangCode') || 'en-US';
    voiceSelectEl.innerHTML = FORCED_ACCENTS.map(a => `<option value="${a.code}">${a.label}</option>`).join('');
    voiceSelectEl.value = savedCode;

    if (allVoices.length) {
        const usV = pickBestVoice(allVoices, 'en-US');
        const gbV = pickBestVoice(allVoices, 'en-GB');
        if (usV && gbV && usV.voiceURI === gbV.voiceURI) {
            voiceNoteEl.textContent = 'ℹ️ الجهاز فيه صوت واحد مُثبَّت، وبيتغيّر النطق حسب اللكنة المختارة قدر الإمكان.';
        } else {
            voiceNoteEl.textContent = '';
        }
    }
}
voiceSelectEl.addEventListener('change', function() {
    localStorage.setItem('ttsLangCode', this.value);
});

function getSelectedVoice() {
    const code = localStorage.getItem('ttsLangCode') || 'en-US';
    return pickBestVoice(voices, code) || voices.find(vv => (vv.lang || '').toLowerCase().startsWith('en')) || null;
}
function getSelectedLangCode() {
    return localStorage.getItem('ttsLangCode') || 'en-US';
}

window._q = []; window._qi = 0;
window._currentUtterance = null;
let currentHighlightedId = null;

function clearAllHighlights() {
    document.querySelectorAll('.active-sent').forEach(e => e.classList.remove('active-sent'));
    currentHighlightedId = null;
}
function showFab(show) { if (show) fabPause.classList.add('show'); else fabPause.classList.remove('show'); }
function updateFabIcon() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) fabPause.innerHTML = '⏸️';
    else if (window.speechSynthesis.paused) fabPause.innerHTML = '▶️';
    else fabPause.innerHTML = '⏯️';
}

function playQueue() {
    if (window._qi >= window._q.length) {
        clearAllHighlights(); showFab(false); return;
    }
    const item = window._q[window._qi];
    if (currentHighlightedId !== item.id) {
        clearAllHighlights();
        const el = document.getElementById(item.id);
        if (el) {
            el.classList.add('active-sent');
            el.scrollIntoView({behavior:'smooth',block:'nearest'});
            currentHighlightedId = item.id;
        }
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.rate = parseFloat(rateRange.value) || 1;
    u.lang = getSelectedLangCode();
    const voice = getSelectedVoice();
    if (voice) u.voice = voice;

    u.onstart = () => { showFab(true); updateFabIcon(); };
    u.onend = function() { window._qi++; playQueue(); };
    u.onerror = function(e) { console.warn('Speech error', e); window._qi++; playQueue(); };
    u.onpause = () => updateFabIcon();
    u.onresume = () => updateFabIcon();

    window._currentUtterance = u;
    window.speechSynthesis.speak(u);
}

function splitAndQueue(textParts, id) {
    textParts.forEach((p) => { const trimmed = p.trim(); if (trimmed) window._q.push({id: id, text: trimmed}); });
}

function playSection(secId) {
    stopAll();
    const sec = document.getElementById(secId);
    const els = [...sec.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playAll() {
    stopAll();
    const els = [...document.querySelectorAll('[data-speak]')];
    els.forEach(el => {
        const text = el.dataset.speak;
        const parts = text.split('|').map(p => p.trim());
        splitAndQueue(parts, el.id);
    });
    window._qi = 0;
    playQueue();
}

function playOne(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const text = el.dataset.speak;
    stopAll();
    const parts = text.split('|').map(p => p.trim());
    splitAndQueue(parts, id);
    window._qi = 0;
    playQueue();
}

function pauseAll() {
    if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
        window.speechSynthesis.pause(); updateFabIcon();
    } else if (window.speechSynthesis.paused) {
        window.speechSynthesis.resume(); updateFabIcon();
    }
}

function stopAll() {
    window._q = []; window._qi = 0;
    clearAllHighlights();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showFab(false);
}

function toggleFabPause() { pauseAll(); }

// ===================== الثيمات =====================
function setTheme(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    localStorage.setItem('theme', theme);
}
const savedTheme = localStorage.getItem('theme') || 'teal';
document.documentElement.setAttribute('data-theme', savedTheme);
document.querySelectorAll('.theme-btn').forEach(b => {
    if (b.classList.contains('t-'+savedTheme)) b.classList.add('active');
});

// ===================== بدء التشغيل =====================
buildAllSections();
loadVoices();
setTimeout(loadVoices, 300);
setTimeout(loadVoices, 1000);
setTimeout(loadVoices, 2500);
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
</script>
